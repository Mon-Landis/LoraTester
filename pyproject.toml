[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-lora-tester"
version = "0.1.0"
description = "LoRA comparison layout and image compositor for ComfyUI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
include = ["lora_tester*"]

